[package]
name = "polvo-p2p"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Polvo's transport between networks: an iroh endpoint dialed by the installation's ed25519 key"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
iroh = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
