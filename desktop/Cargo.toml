[package]
name = "polvo-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The native window of Polvo: GPUI, libghostty-vt and portable-pty"

[[bin]]
name = "polvo-desktop"
path = "src/main.rs"

[dependencies]
dirs = "6"
futures = "0.3"
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
libghostty-vt = "0.2.2"
portable-pty = "0.9.0"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support", "tree-sitter-languages"] }
tempfile = "3"

# The dock asks a panel before closing it (the editor with unsaved changes, EDTRS-B06): a small patch on
# gpui-base and gpui-component 0.7.3, kept until upstream has the hook (third_party/README.md).
[patch.crates-io]
gpui-base = { path = "../third_party/gpui-base" }
gpui-component = { path = "../third_party/gpui-component" }
