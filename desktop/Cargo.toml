[package]
name = "polvo-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The native window of Polvo: GPUI, libghostty-vt and portable-pty"

[[bin]]
name = "polvo-desktop"
path = "src/main.rs"

[dependencies]
dirs = "6"
futures = "0.3"
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
libghostty-vt = "0.2.2"
portable-pty = "0.9.0"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support", "tree-sitter-languages"] }
tempfile = "3"
